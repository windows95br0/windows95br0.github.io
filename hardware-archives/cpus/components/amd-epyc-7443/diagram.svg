<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">AMD EPYC 7443 functional schematic</title><desc id="desc">Original schematic representing 24 Zen-family CPU cores, the integrated memory controller and PCI Express I/O for AMD EPYC 7443. Not to scale and not a pinout.</desc><rect width="720" height="460" rx="12" fill="#11191b"/><g fill="none" stroke="#72d5c7" stroke-width="3"><rect x="42" y="70" width="636" height="320" rx="18"/><rect x="68" y="100" width="370" height="255" rx="12" stroke-dasharray="8 7"/><rect x="470" y="112" width="180" height="92" rx="8"/><rect x="470" y="232" width="180" height="92" rx="8"/><path d="M438 175h32M438 280h32M438 225h20v53M114 75V48m48 27V48m48 27V48m48 27V48m48 27V48m48 27V48m48 27V48m48 27V48M114 390v26m48-26v26m48-26v26m48-26v26m48-26v26m48-26v26m48-26v26m48-26v26"/></g><g fill="#e5f4ec" font-family="monospace"><text x="48" y="32" font-size="17" fill="#72d5c7">HARDWARE ARCHIVES // AMD EPYC 7443</text><text x="90" y="132" font-size="14" fill="#9fbab0">ZEN 3 MILAN COMPUTE COMPLEX</text><text x="92" y="177" font-size="20">24 CORES / 48 THREADS</text><text x="92" y="218" font-size="15">128 MB L3 CACHE</text><text x="92" y="257" font-size="15">SP3 SERVER PACKAGE</text><text x="92" y="310" font-size="13" fill="#9fbab0">MODEL-SPECIFIC FUNCTIONAL BLOCKS</text><text x="487" y="150" font-size="14">MEMORY CTRL</text><text x="486" y="176" font-size="12">8-channel DDR4-3200 ECC</text><text x="492" y="274" font-size="14">I/O CONNECT</text><text x="490" y="300" font-size="12">128 lanes PCIe 4.0</text><text x="47" y="442" font-size="12" fill="#9fbab0">ORIGINAL REFERENCE SCHEMATIC • NOT A PACKAGE DRAWING • NOT A PINOUT • NOT TO SCALE</text></g></svg>