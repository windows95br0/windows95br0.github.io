<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc"><title id="title">NETGEAR DM111P ADSL2+ Ethernet Modem original modem schematic</title><desc id="desc">Original abstract signal-flow drawing for NETGEAR DM111P ADSL2+ Ethernet Modem, with its modem-side line and host-side interface marked; not to scale.</desc><defs><linearGradient id="bg4" x2="1" y2="1"><stop stop-color="#172c3c"/><stop offset="1" stop-color="#09141f"/></linearGradient></defs><rect x="12" y="18" width="296" height="184" rx="12" fill="url(#bg4)" stroke="#83aaff" stroke-width="2"/><path d="M28 52H292M28 180H292" stroke="#496071"/><text x="30" y="42" fill="#83aaff" font-family="monospace" font-size="11">MODEM ARCHIVE // 04</text><rect x="31" y="72" width="258" height="45" rx="5" fill="#0b1822" stroke="#496071"/><text x="42" y="99" fill="#e6edf2" font-family="monospace" font-size="12">NETGEAR DM111P</text><rect x="35" y="132" width="54" height="25" rx="3" fill="#132b3a" stroke="#83aaff"/><text x="43" y="148" fill="#e8edf2" font-size="9" font-family="monospace">RJ-11</text><rect x="225" y="132" width="58" height="25" rx="3" fill="#132b3a" stroke="#83aaff"/><text x="229" y="148" fill="#e8edf2" font-size="9" font-family="monospace">10/100 LAN</text><path d="M90 144H224" stroke="#83aaff" stroke-width="2" stroke-dasharray="5 4"/><circle cx="157" cy="144" r="5" fill="#83aaff"/><text x="57" y="171" fill="#b7c9d5" font-family="monospace" font-size="9">RJ-11 LINE  •  DMT ADSL2+  •  10/100 LAN</text></svg>