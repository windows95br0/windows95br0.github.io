<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">A2Heaven SDFloppy II interface schematic</title><desc id="desc">Conceptual signal path from DISK II INTERFACE CARD through A2Heaven SDFloppy II to UP TO 36 DSK IMAGES, not to scale.</desc>
<rect width="960" height="300" rx="18" fill="#111827"/><path d="M28 45H932M28 254H932" stroke="#314055" stroke-width="2"/><text x="40" y="33" fill="#77d7cb" font-family="monospace" font-size="14" letter-spacing="2">LOCAL HARDWARE REFERENCE // SIGNAL FLOW</text>
<rect x="40" y="83" width="220" height="132" rx="12" fill="#1e293b" stroke="#57c7b5" stroke-width="2"/><text x="58" y="116" fill="#f4f7fb" font-family="sans-serif" font-size="18" font-weight="700">DISK II INTERFACE CARD</text><text x="58" y="149" fill="#a9bacd" font-family="sans-serif" font-size="14">HOST CONTROLLER</text><text x="58" y="178" fill="#77d7cb" font-family="monospace" font-size="13">DISK II CABLE</text>
<path d="M260 149H344" stroke="#77d7cb" stroke-width="4"/><path d="m334 140 12 9-12 9" fill="none" stroke="#77d7cb" stroke-width="4"/>
<rect x="350" y="69" width="260" height="160" rx="14" fill="#182638" stroke="#e9b45e" stroke-width="3"/><text x="480" y="105" fill="#e9b45e" font-family="monospace" font-size="13" text-anchor="middle">EMULATOR HARDWARE</text><text x="480" y="140" fill="#f4f7fb" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">A2Heaven</text><text x="480" y="168" fill="#d5deea" font-family="sans-serif" font-size="14" text-anchor="middle">48 × 40 × 20 MM</text><text x="480" y="197" fill="#a9bacd" font-family="monospace" font-size="12" text-anchor="middle">DRIVE TIMING / DATA SIGNALS</text>
<path d="M610 149H694" stroke="#77d7cb" stroke-width="4"/><path d="m684 140 12 9-12 9" fill="none" stroke="#77d7cb" stroke-width="4"/>
<rect x="700" y="83" width="220" height="132" rx="12" fill="#1e293b" stroke="#57c7b5" stroke-width="2"/><text x="718" y="116" fill="#f4f7fb" font-family="sans-serif" font-size="17" font-weight="700">UP TO 36 DSK IMAGES</text><text x="718" y="149" fill="#a9bacd" font-family="sans-serif" font-size="14">REMOVABLE MEDIA</text><text x="718" y="178" fill="#77d7cb" font-family="monospace" font-size="13">SD + .DSK</text>
<text x="40" y="280" fill="#91a0b5" font-family="sans-serif" font-size="13">Concept schematic only. Exact connector, power, image format and host support are revision/configuration dependent.</text></svg>