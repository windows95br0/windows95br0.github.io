<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc"><title id="title">ASUS TUF Gaming 750W Bronze original power-path schematic</title><desc id="desc">Locally drawn archival block diagram for the TUF Gaming 750W Bronze 750 watt ATX12V PSU. Shows generic conversion path, named DC rail capacities and connector classes. Not a service schematic, pinout, or cable-side map.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ff8fab"/></marker></defs><rect width="720" height="370" fill="#080e0d"/><text x="360" y="32" fill="#ffe99a" text-anchor="middle" font-family="monospace" font-size="15">ASUS TUF Gaming 750W Bronze // 750 W</text><g fill="#101b18" stroke="#ff8fab" stroke-width="2"><rect x="24" y="94" width="116" height="58" rx="5"/><rect x="174" y="94" width="116" height="58" rx="5"/><rect x="324" y="94" width="116" height="58" rx="5"/><rect x="474" y="94" width="102" height="58" rx="5"/><rect x="610" y="94" width="86" height="58" rx="5"/><path d="M140 123h34m116 0h34m116 0h34m102 0h34" marker-end="url(#arrow)"/></g><g fill="#ffe99a" font-family="monospace" font-size="11" text-anchor="middle"><text x="82" y="119">AC INPUT</text><text x="82" y="136">100–240 V</text><text x="232" y="119">FILTER / PFC</text><text x="382" y="119">ISOLATED DC</text><text x="525" y="119">RAIL OUTPUT</text><text x="653" y="119">ATX LEADS</text></g><rect x="26" y="187" width="668" height="112" rx="5" fill="#101b18" stroke="#3aa982" stroke-width="2"/><text x="44" y="211" fill="#ff8fab" font-family="monospace" font-size="12">MANUFACTURER OUTPUT TABLE // TOTAL 750 W</text><g fill="#f2f2df" font-family="monospace" font-size="11"><text x="46" y="237">+3.3 V 25 A  //  +5 V 25 A</text><text x="46" y="258">+12 V 62 A  //  −12 V 0.8 A</text><text x="46" y="279">+5 VSB 3 A</text><text x="382" y="237">ATX12V; ASUS lists the ATX standard as “NA” for this model. // 80 PLUS Bronze</text><text x="382" y="258">MB 24/20-pin ×1; CPU 4+4-pin ×2; PCI-E 6+2-pin </text><text x="382" y="279">VERIFY EXACT CABLE SET IN ASUS MANUAL</text></g><text x="360" y="332" fill="#ff8fab" text-anchor="middle" font-family="monospace" font-size="11">ORIGINAL ARCHIVAL BLOCK DIAGRAM // NOT A SERVICE SCHEMATIC OR PINOUT</text></svg>