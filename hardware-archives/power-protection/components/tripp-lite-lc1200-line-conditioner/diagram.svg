<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Tripp Lite LC1200 Line Conditioner functional schematic</title><desc id="desc">Locally created schematic of the device's power path. Not a wiring diagram and not to scale.</desc><rect width="800" height="300" fill="#080d13"/><text x="24" y="38" fill="#54f6d1" font-family="monospace" font-size="14">POWER PATH // LINE CONDITIONER</text><text x="24" y="70" fill="#c9d4df" font-family="monospace" font-size="12">Tripp Lite LC1200 Line Conditioner</text><rect x="24" y="102" width="235" height="96" rx="4" fill="#101b25" stroke="#54f6d1" stroke-width="2"/><text x="141" y="142" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="15">MAINS</text><text x="141" y="168" text-anchor="middle" fill="#54f6d1" font-family="monospace" font-size="13">INPUT</text><path d="M262 150h16" stroke="#ffcc57" stroke-width="3"/><path d="m270 144 7 6-7 6" fill="none" stroke="#ffcc57" stroke-width="3"/><rect x="283" y="102" width="235" height="96" rx="4" fill="#101b25" stroke="#54f6d1" stroke-width="2"/><text x="400" y="142" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="15">AVR</text><text x="400" y="168" text-anchor="middle" fill="#54f6d1" font-family="monospace" font-size="13">REGULATION</text><path d="M520 150h16" stroke="#ffcc57" stroke-width="3"/><path d="m528 144 7 6-7 6" fill="none" stroke="#ffcc57" stroke-width="3"/><rect x="541" y="102" width="235" height="96" rx="4" fill="#101b25" stroke="#54f6d1" stroke-width="2"/><text x="659" y="142" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="15">PROTECTED</text><text x="659" y="168" text-anchor="middle" fill="#54f6d1" font-family="monospace" font-size="13">OUTPUT</text><text x="24" y="250" fill="#ffcc57" font-family="monospace" font-size="12">FUNCTIONAL REFERENCE ONLY • NOT FOR INSTALLATION OR REPAIR</text></svg>
