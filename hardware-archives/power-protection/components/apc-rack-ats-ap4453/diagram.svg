<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">AP4453 functional ATS schematic</title><desc id="desc">Original non-installation schematic for AP4453; two AC sources feed an automatic transfer unit and its documented 16 × NEMA 5-20R output configuration. Not to scale.</desc><rect width="640" height="360" fill="#080e0d"/><g fill="none" stroke="#8cffc6" stroke-width="4"><rect x="35" y="78" width="150" height="75" rx="8"/><rect x="35" y="207" width="150" height="75" rx="8"/><rect x="245" y="115" width="150" height="130" rx="10"/><rect x="455" y="115" width="150" height="130" rx="8"/><path d="M185 115h60m-15-14 15 14-15 14M185 244h60m-15-14 15 14-15 14M395 180h60m-15-14 15 14-15 14M275 151h90m-90 30h90m-90 30h64"/></g><g fill="#ffe99a" font-family="monospace" text-anchor="middle"><text x="110" y="68" font-size="12">SOURCE A // 2 × NEMA L5-30P</text><text x="110" y="197" font-size="12">SOURCE B // 2 × NEMA L5-30P</text><text x="320" y="98" font-size="13">AUTOMATIC TRANSFER</text><text x="530" y="98" font-size="13">OUTPUT // 16 × NEMA 5-20R</text><text x="320" y="317" font-size="18" letter-spacing="2">AP4453 // 2U</text><text x="320" y="339" font-size="10">120 V AC // 30 A (24 A continuous-load reference where applicable)</text></g></svg>