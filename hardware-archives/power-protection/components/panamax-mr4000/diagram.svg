ce" font-size="11">COAX / TELECOM PORTS</text><text x="380" y="381" text-anchor="middle" fill="#91b5b6" font-family="monospace" font-size="13">MR4000  //  FUNCTIONAL SCHEMATIC  //  NOT TO SCALE</text><text x="380" y="422" text-anchor="middle" fill="#91b5b6" font-family="monospace" font-size="11">VERIFY NAMEPLATE, SOURCE, PROTECTION STATE AND MODEL MANUAL</text></svg>
