<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">Tripp Lite SMART1500LCDXL line-interactive power path</title><desc id="desc">Original schematic for SMART1500LCDXL: utility passes through AVR to load; inverter and battery provide backup after transfer.</desc><rect width="720" height="340" rx="18" fill="#07111a"/><g fill="none" stroke="#55d7ef" stroke-width="4"><path d="M45 142h125m115 0h90m105 0h195"/><path d="M273 160v85h83" stroke="#ffc96b"/><path d="M378 245h105" stroke="#ffc96b"/></g><g fill="#101e2a" stroke="#92dfff" stroke-width="2"><rect x="35" y="105" width="135" height="74" rx="10"/><rect x="170" y="100" width="115" height="84" rx="10"/><rect x="375" y="100" width="105" height="84" rx="10"/><rect x="545" y="105" width="140" height="74" rx="10"/><rect x="356" y="215" width="127" height="62" rx="10" fill="#2a2114" stroke="#ffc96b"/></g><g fill="#d8f4ff" font-family="Arial,sans-serif" text-anchor="middle"><text x="102" y="135" font-size="14">UTILITY IN</text><text x="102" y="158" font-size="12">1500 VA / 900 W</text><text x="227" y="137" font-size="15">AVR</text><text x="227" y="159" font-size="11">line regulation</text><text x="427" y="137" font-size="15">TRANSFER</text><text x="427" y="159" font-size="11">battery inverter</text><text x="615" y="137" font-size="15">PROTECTED</text><text x="615" y="159" font-size="11">AC LOAD</text><text x="419" y="242" font-size="13" fill="#ffe0a0">SEALED BATTERY</text><text x="419" y="263" font-size="10" fill="#ffe0a0">runtime varies by load &amp; condition</text></g><text x="360" y="315" fill="#55d7ef" font-family="monospace" font-size="13" text-anchor="middle">SMART1500LCDXL // ORIGINAL FUNCTIONAL SCHEMATIC // NOT TO SCALE</text></svg>
