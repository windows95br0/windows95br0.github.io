<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">NI PCIe-6353 schematic</title><desc id="desc">Original schematic of the NI PCIe-6353, showing 32 analog input channels, 4 analog outputs, digital I/O, X Series measurement logic, and the PCI Express x1 edge connector. Not to scale.</desc><rect width="640" height="300" rx="18" fill="#0b1119"/><text x="26" y="32" fill="#a9bac9" font-family="monospace" font-size="12">DAQ ADD-IN CARD // ORIGINAL SCHEMATIC</text><path d="M58 64h484q16 0 16 16v138H76q-18 0-18-18z" fill="#18352f" stroke="#ed7f56" stroke-width="3"/><rect x="82" y="91" width="138" height="83" rx="7" fill="#111923" stroke="#66827b" stroke-width="2"/><text x="151" y="119" text-anchor="middle" fill="#f2f5f7" font-family="monospace" font-size="12">NI PCIe-6353</text><text x="151" y="144" text-anchor="middle" fill="#a9bac9" font-family="monospace" font-size="10">AI 32 // 16-bit</text><rect x="265" y="91" width="107" height="83" rx="7" fill="#111923" stroke="#66827b" stroke-width="2"/><text x="318" y="119" text-anchor="middle" fill="#ed7f56" font-family="monospace" font-size="11">X SERIES</text><text x="318" y="142" text-anchor="middle" fill="#a9bac9" font-family="monospace" font-size="10">DAQ CONTROL</text><rect x="418" y="91" width="113" height="83" rx="7" fill="#111923" stroke="#66827b" stroke-width="2"/><text x="474" y="119" text-anchor="middle" fill="#f2f5f7" font-family="monospace" font-size="11">I/O</text><text x="474" y="140" text-anchor="middle" fill="#a9bac9" font-family="monospace" font-size="9">AO 4 // DIO 48</text><path d="M220 132h45m107 0h46M96 197v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29m19-29v29" fill="none" stroke="#ed7f56" stroke-width="3"/><text x="57" y="252" fill="#f2f5f7" font-family="monospace" font-size="14">NI PCIe-6353 // 1.25 MS/s aggregate AI</text><text x="57" y="274" fill="#ed7f56" font-family="monospace" font-size="11">PCI Express x1 // X Series multifunction DAQ</text></svg>