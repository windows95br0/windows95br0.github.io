<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Cambridge Audio DacMagic 100 signal path</title><desc id="desc">Original block schematic: USB • OPT • COAX connects to WM8742 DAC, then STEREO RCA.</desc><rect width="760" height="300" rx="22" fill="#111a23"/><path d="M0 72H760M0 228H760" stroke="#2f414d" stroke-width="2"/><text x="40" y="48" fill="#c0d3dc" font-family="monospace" font-size="17">CAMBRIDGE-AUDIO-DACMAGIC-100 / CONVERSION PATH</text><rect x="42" y="111" width="190" height="78" rx="12" fill="#1c2b35" stroke="#f6c66f" stroke-width="3"/><rect x="285" y="98" width="190" height="104" rx="14" fill="#20313d" stroke="#f6c66f" stroke-width="4"/><rect x="528" y="111" width="190" height="78" rx="12" fill="#1c2b35" stroke="#f6c66f" stroke-width="3"/><path d="M232 150h53m190 0h53" stroke="#e5f0f2" stroke-width="4"/><path d="m274 140 12 10-12 10m192-20 12 10-12 10" fill="none" stroke="#e5f0f2" stroke-width="4"/><text x="137" y="155" text-anchor="middle" fill="#e9f1f4" font-family="monospace" font-size="17">USB • OPT • COAX</text><text x="380" y="142" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16">WM8742 DAC</text><text x="380" y="167" text-anchor="middle" fill="#b7c8d0" font-family="monospace" font-size="13">STEREO D/A</text><text x="623" y="155" text-anchor="middle" fill="#e9f1f4" font-family="monospace" font-size="17">STEREO RCA</text><text x="42" y="265" fill="#91a5af" font-family="monospace" font-size="13">HOST, INPUT RATE AND OUTPUT MODE ARE MODEL-SPECIFIC</text></svg>